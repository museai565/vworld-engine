<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VWorld — Quest Playground</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{display:block}#hud{position:fixed;left:12px;top:12px;color:#fff;font:13px/1.6 system-ui;background:rgba(0,0,0,.45);padding:10px 12px;border-radius:8px;pointer-events:none}
  #hud b{color:#ffd97a}kbd{background:#222;border:1px solid #555;border-radius:4px;padding:0 6px}
  #dlg{position:fixed;right:12px;bottom:12px;color:#fff;font:14px/1.5 system-ui;background:rgba(10,10,20,.8);padding:12px 14px;border-radius:10px;max-width:320px;display:none}
  #dlg button{display:block;margin:6px 0;width:100%;text-align:left;background:#243;color:#fff;border:1px solid #465;border-radius:6px;padding:6px 8px;cursor:pointer}</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud"><b>Quest playground</b><br>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · walk into coins to collect<br>
  Talk to the villager: walk close, then press <kbd>E</kbd></div>
  <div id="dlg"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
